            <div class="mb-10 w-full overflow-hidden">
                <h1 id="project-title" class="display text-left leading-[90%] whitespace-nowrap"></h1>
            </div>

            <!-- PROJECT INFOS -->
            <div class="mb-10 grid grid-cols-2 gap-5 md:grid-cols-4 lg:px-8 lg:py-20">
                <div class="flex flex-col gap-1">
                    <p class="text-heading font-medium">Role</p>
                    <p id="project-role"></p>
                </div>
                <div class="flex flex-col gap-1">
                    <p class="text-heading font-medium">Year</p>
                    <p id="project-year"></p>
                </div>
                <div class="flex flex-col gap-1">
                    <p class="text-heading font-medium">Client</p>
                    <p id="project-client"></p>
                </div>
                <div class="flex flex-col gap-1">
                    <p class="text-heading font-medium">Created by</p>
                    <p id="project-creator"></p>
                </div>
            </div>
            
            <!-- Content Header -->
            <div class="border-border-default mb-5 flex justify-between border-b pb-2 md:mb-10">
                <p>About</p>
                <p>SBXone</p>
            </div>
            
            <!-- Mockup Images (populated by JS from project.mockup[]) -->
            <div id="project-mockup" class="flex grid-cols-2 gap-2 w-full overflow-hidden md:grid md:grid-cols-4 md:gap-5">
                <!-- Dynamically injected by project-detail.js -->
            </div>
        </section>

        <section class="flex grid-cols-3 flex-col gap-5 px-8 py-10 md:py-20 md:grid">
            <h3>Overview.</h3>
            <p id="project-overview" class="col-span-2 col-start-2"></p>
        </section>

        <section class="px-8 py-10 md:py-20">
            <div class="border-border-default mb-8 flex justify-between border-b pb-2">
                <p>Screens</p>
            </div>
            <div id="project-screen" class="grid grid-cols-4 gap-5 w-full">
                <!-- Dynamically injected by project-detail.js -->
                <div class="bg-white w-full rounded-lg object-contain object-center border border-border-default h-120"></div>
            </div>
        </section>

        <!-- Next / Previous Navigation -->
        <section class="border-border-default flex justify-between border-t border-b px-8 py-10">
            <div id="nav-prev" class="flex flex-col">
                <p class="text-sm">Previous</p>
                <a href="#" class="text-heading text-xl font-medium hover:underline"></a>
            </div>
            <div id="nav-next" class="flex flex-col text-right">
                <p class="text-sm">Next</p>
                <a href="#" class="text-heading text-xl font-medium hover:underline"></a>

            <h1 class="display leading-[70%]">DS</h1>

            <div class="flex flex-col gap-1">
                <p class="text-heading font-medium">Location</p>
                <p>Denpasar City, Bali <br />80113 Indonesia</p>
            </div>

            <div class="flex flex-col gap-1">

                    <a href="">Instagram</a>
                    <a href="">Twitter</a>

                <span class="border-border-default h-full rounded-full border-1 bg-white p-3">
                    <svg class="" xmlns="http://www.w3.org/2000/svg" width="1.5em" height="1.5em" viewBox="0 0 24 24">

                        />
